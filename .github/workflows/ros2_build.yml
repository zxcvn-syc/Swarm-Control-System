name: ROS2 Build & Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Docker path (preferred) --------------------------------
      # Builds (or reuses) the ROS2 Humble image defined in
      # docker/ros2_humble.Dockerfile so apt / pip install only happens
      # once.  We then run colcon build and the integration test inside
      # the container.
      - name: Build ROS2 Humble Docker image
        run: |
          docker build \
            -f docker/ros2_humble.Dockerfile \
            -t swarm-ci:humble .

      - name: Build workspace inside Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            swarm-ci:humble \
            bash -c "set -o pipefail && \
                     source /opt/ros/humble/setup.bash && \
                     cd ros2_ws && \
                     colcon build --packages-select planning_pkg scheduler_pkg containment_pkg perception_pkg swarm_interfaces 2>&1 | tail -20"

      - name: Run integration test (5x) inside Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            swarm-ci:humble \
            bash -c "source /opt/ros/humble/setup.bash && \
                     source ros2_ws/install/setup.bash && \
                     cd ros2_ws && \
                     FAIL=0; \
                     for i in 1 2 3 4 5; do \
                       echo \"=== Run \$i ===\"; \
                       python3 test_three_links.py && echo PASS || FAIL=1; \
                     done; \
                     exit \$FAIL"

      - name: Run pytest inside Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            swarm-ci:humble \
            bash -c "set -o pipefail && \
                     source /opt/ros/humble/setup.bash && \
                     source ros2_ws/install/setup.bash && \
                     FAIL=0; \
                     for pkg in planning_pkg scheduler_pkg containment_pkg perception_pkg; do \
                       echo \"=== \$pkg ===\"; \
                       python3 -m pytest ros2_ws/src/\$pkg/tests/ -v --tb=short 2>&1 | tail -80 || FAIL=1; \
                     done; \
                     exit \$FAIL"

      # ----- Bare-metal fallback ------------------------------------
      # If Docker is unavailable in the runner, fall back to the
      # original apt install + colcon workflow so the job still
      # exercises every step.  Only runs when the Docker path failed;
      # with ``if: always()`` these steps executed even on success and
      # their (expected) failures produced confusing error annotations.
      - name: Fallback - install ROS2 Humble
        if: failure()
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu \
            $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | \
            sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-pip \
            ros-humble-ros-base \
            ros-humble-nav-msgs \
            ros-humble-geometry-msgs \
            ros-humble-std-msgs \
            ros-humble-sensor-msgs \
            ros-humble-cv-bridge \
            ros-humble-image-transport \
            ros-humble-mavros-msgs

      - name: Fallback - install Python deps
        if: failure()
        continue-on-error: true
        run: |
          pip install --break-system-packages \
            "numpy<2" \
            "opencv-python<4.11"

      - name: Fallback - build workspace
        if: failure()
        continue-on-error: true
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args=-DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Fallback - run integration test (5x)
        if: failure()
        continue-on-error: true
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          FAIL=0
          for i in 1 2 3 4 5; do
            echo "=== Run $i ==="
            python3 test_three_links.py && echo "PASS" || FAIL=1
          done
          exit $FAIL
        shell: bash