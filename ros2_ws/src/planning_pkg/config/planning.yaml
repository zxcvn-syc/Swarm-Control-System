# Default parameters for planning_pkg/planner_node.
# Used by ``ros2 launch planning_pkg planning.launch.py``.
planner_node:
  ros__parameters:
    num_drones: 8
    grid_size: 100
    planner: astar            # astar | dstar_lite
    tick_period: 0.5          # seconds between planner ticks
    log_interval_sec: 5.0
    publish_path: true
    sim_tick_speed: 1.0       # cells per tick the drones advance along path

    # Topic plumbing -- matches scheduler_pkg + containment_pkg defaults.
    task_topic: /task_assignment
    grid_topic: /grid_map
    # When set, consume a geometry-preserving nav_msgs/OccupancyGrid instead
    # of the legacy UInt8MultiArray feed.  LiDAR launch sets this to
    # /lidar_occupancy.
    occupancy_grid_topic: ""
    occupancy_threshold: 50
    occupancy_unknown_is_obstacle: true
    planner_grid_output_topic: /planner_grid_map_nav
    drone_states_topic: /drone_states
    planned_path_topic: /planned_path
    rfly_pose_topic: /drone_pose_external

    # Optional: deterministic drone positions in the map frame (metres).
    # If left empty, the planner seeds drones in a square lattice.
    initial_positions: []

    # Optional: pre-seeded obstacles on the grid.  Each entry is either
    #   {x: <int>, y: <int>}
    # or
    #   {x0: <int>, y0: <int>, x1: <int>, y1: <int>}
    # The rectangles are inclusive on both endpoints.
    obstacle_cells: []

    # Optional: explicit per-drone target cells.  Each entry should have
    # ``drone_id`` plus ``x`` / ``y``; an integer triple ``(id, x, y)``
    # also works.  When a drone has an explicit target, ``TaskAssignment``
    # ``target_id`` is ignored for that drone.
    explicit_target_cells: []

    # 8.27 三场景封控（security 绕障重规划）参数：说明见下，默认关闭。
    # enclosure_targets_topic: /enclosure_targets     订阅逃逸目标，位置变化触发重规划
    # scene_config_file:       path to three_scene_config.yaml（空=不读场景障碍物）
    # scene_name:              park | security | border（配合上一项生效）
    enclosure_targets_topic: /enclosure_targets
    scene_config_file: ""
    scene_name: ""
