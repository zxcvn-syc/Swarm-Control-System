<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>飞行安全操作台</title>
    <link rel="stylesheet" href="/flight_safety_dashboard.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>飞行安全操作台</h1>
        </div>
        <div class="header-status" aria-live="polite">
          <span class="connection-dot" id="status-dot"></span>
          <span id="status-connection">等待安全状态</span>
          <time id="local-time"></time>
        </div>
      </header>

      <section class="workspace" aria-label="封控操作台">
        <section class="monitor-column" aria-labelledby="video-heading">
          <div class="section-heading">
            <div>
              <p class="section-label">实时监控</p>
              <h2 id="video-heading">现场视频</h2>
            </div>
            <div class="stream-meta" id="video-meta">等待视频流</div>
          </div>

          <div class="video-frame" id="video-frame">
            <img id="video-stream" src="/stream.mjpg" alt="封控现场实时视频流">
            <div class="video-empty" id="video-empty" aria-live="polite">
              <span class="empty-reticle" aria-hidden="true"></span>
              <strong>未收到视频流</strong>
              <span>请确认压缩图像话题与相机链路</span>
            </div>
            <div class="video-overlay" id="video-overlay" hidden>
              <span id="overlay-target">未锁定目标</span>
              <span id="overlay-frame">实时帧</span>
            </div>
          </div>

          <section class="event-section" aria-labelledby="event-heading">
            <div class="section-heading compact-heading">
              <div>
                <p class="section-label">运行记录</p>
                <h2 id="event-heading">本次会话事件</h2>
              </div>
              <button class="text-button" type="button" id="clear-events">清空</button>
            </div>
            <ol class="event-log" id="event-log" aria-live="polite">
              <li class="event-empty">尚未收到安全状态或操作结果。</li>
            </ol>
          </section>
        </section>

        <aside class="command-rail" aria-label="封控状态与控制">
          <section class="state-panel" aria-labelledby="state-heading">
            <p class="section-label">封控状态</p>
            <h2 id="state-heading" class="state-name">等待安全状态</h2>
            <p class="state-reason" id="state-reason">监督器尚未发布状态。</p>
          </section>

          <dl class="status-list" aria-label="安全链路状态">
            <div>
              <dt>目标锁定</dt>
              <dd id="target-lock">未知</dd>
            </div>
            <div>
              <dt>封控模式</dt>
              <dd id="activation-mode">未知</dd>
            </div>
            <div>
              <dt>保持请求</dt>
              <dd id="hold-state">未知</dd>
            </div>
            <div>
              <dt>MAVROS</dt>
              <dd id="mavros-state">未知</dd>
            </div>
            <div>
              <dt>平台状态</dt>
              <dd id="platform-state">未知</dd>
            </div>
            <div>
              <dt>封控指令</dt>
              <dd id="command-state">未知</dd>
            </div>
          </dl>

          <form class="control-form" id="control-form">
            <div class="field-group">
              <label for="operator-id">操作员编号</label>
              <input id="operator-id" name="operator-id" maxlength="64" autocomplete="username" placeholder="例如 safety_pilot">
            </div>
            <div class="field-group">
              <label for="operator-token">控制令牌</label>
              <input id="operator-token" name="operator-token" type="password" autocomplete="off" placeholder="仅保存在当前页面内存中">
            </div>

            <fieldset class="mode-select">
              <legend>启用方式</legend>
              <div class="segmented-control">
                <label><input type="radio" name="activation-mode" value="manual" checked><span>手动</span></label>
                <label><input type="radio" name="activation-mode" value="auto"><span>自动</span></label>
              </div>
            </fieldset>

            <button class="command-button primary" type="submit" id="enable-button">开启手动封控</button>
            <button class="command-button neutral" type="button" data-command="disable">停止封控</button>
            <button class="command-button emergency" type="button" data-command="emergency_hold">紧急保持</button>
            <label class="confirm-row" for="ground-confirmed">
              <input id="ground-confirmed" type="checkbox">
              <span>已确认飞行器及现场处于地面安全状态</span>
            </label>
            <button class="command-button reset" type="button" data-command="reset_fault" id="reset-button" disabled>地面确认后复位</button>
            <p class="control-message" id="control-message" role="status">只控制封控安全门，不发送 PX4 解锁、模式或飞行指令。</p>
          </form>
        </aside>
      </section>
    </main>
    <noscript>此操作台需要浏览器启用 JavaScript 才能获取实时状态。</noscript>
    <script src="/flight_safety_dashboard.js" defer></script>
  </body>
</html>
